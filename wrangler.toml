name = "draliwellness"
compatibility_date = "2026-11-22"
workers_dev = true

# Entire Vite storefront: build with `bun run build` before deployment.
# Deploy with `npx wrangler deploy` from the repository root.
# Cloudflare serves static assets directly; /admin and other React routes
# fall back to index.html, allowing client-side routing.
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
