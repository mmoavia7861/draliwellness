name: Validate WhatsApp Order Confirmation PR

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun test src/utils/commerce.test.ts src/utils/admin.test.ts src/utils/assistant.test.ts src/utils/studio.test.ts
      - name: Validate Cloudflare Worker JavaScript
        run: |
          node --check workers/site-with-ai.js
          node --check workers/whatsapp-confirmations.js
          node --check workers/order-notifications.js
          node --check workers/order-email-details.js
      - run: bun run build
