name: Deploy Dr Ali Wellness to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun (match Cloudflare Workers Builds)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type-check storefront and admin
        run: bun run lint
      - name: Run storefront business-logic unit tests
        run: bun test src/utils/commerce.test.ts src/utils/admin.test.ts src/utils/assistant.test.ts src/utils/studio.test.ts
      - name: Check Worker API modules parse
        run: |
          node --check workers/site-with-ai.js
          node --check workers/order-notifications.js
          node --check workers/order-email-details.js
      - name: Build GitHub Pages version
        env:
          GITHUB_PAGES: 'true'
          VITE_AI_GUIDE_API_BASE_URL: ${{ vars.VITE_AI_GUIDE_API_BASE_URL }}
          VITE_ENABLE_AI_STUDIO: 'false'
        run: |
          bun run build
          cp dist/index.html dist/404.html
      - name: Validate sitemap, robots, and built assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          import xml.etree.ElementTree as ET

          output = Path('dist')
          sitemap = output / 'sitemap.xml'
          robots = output / 'robots.txt'
          assert (output / 'index.html').is_file(), 'Homepage was not built'
          assert sitemap.is_file(), 'Sitemap missing'
          assert robots.is_file(), 'Robots directives missing'
          ns = '{http://www.sitemaps.org/schemas/sitemap/0.9}'
          urls = [element.text for element in ET.parse(sitemap).iter(ns + 'loc')]
          assert len(urls) >= 2, 'Sitemap has no useful URLs'
          assert all(url and urlparse(url).scheme == 'https' and urlparse(url).netloc == 'draliwellness.com' for url in urls), 'Sitemap URLs must be canonical and absolute'
          assert 'Sitemap: https://draliwellness.com/sitemap.xml' in robots.read_text(), 'Robots sitemap reference missing'
          print(f'Validated {len(urls)} canonical sitemap URLs and robots.txt.')
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Allow uploaded Pages artifact to be indexed
        run: sleep 12
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Diagnose custom domain and Cloudflare Worker availability
        if: always()
        shell: bash
        run: |
          echo "DNS/HTTP diagnostics are informational; DNS migration is managed in Cloudflare/Spaceship."
          for host in draliwellness.com www.draliwellness.com; do
            echo "::group::DNS and HTTPS: ${host}"
            getent ahostsv4 "$host" | head -n 4 || true
            curl --silent --show-error --location --output /dev/null \
              --connect-timeout 5 --max-time 12 \
              --write-out 'HTTP: %{http_code}; final: %{url_effective}; remote IP: %{remote_ip}\\n' \
              "https://${host}/" || true
            echo "::endgroup::"
          done
          echo "::group::Cloudflare Worker API status"
          curl --silent --show-error --connect-timeout 5 --max-time 12 \
            "https://draliwellness.moavia400.workers.dev/api/orders/notification-status" || true
          echo
          echo "::endgroup::"
      - name: Verify deployed homepage and JavaScript
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Verifying hosted page at $SITE_URL"
          sleep 8
          curl --fail --silent --show-error --location --retry 4 --retry-delay 3 "${SITE_URL}?v=${GITHUB_SHA}" -o /tmp/site.html
          JS_ASSET="$(grep -oE '/assets/[^"]+\.js' /tmp/site.html | head -n 1 || true)"
          if [[ -z "$JS_ASSET" ]]; then
            echo "::error::The served HTML does not reference the built project JavaScript."
            tail -c 700 /tmp/site.html
            exit 1
          fi
          echo "JavaScript entry: $JS_ASSET"
          SITE_ORIGIN="${SITE_URL%/}"
          curl --fail --silent --show-error --location --head --retry 4 --retry-delay 3 "${SITE_ORIGIN}${JS_ASSET}" > /tmp/asset-head.txt
          echo "Main JavaScript asset returns HTTP 200."
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -n "$BROWSER" ]]; then
            timeout 45 "$BROWSER" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --no-first-run --virtual-time-budget=12000 --dump-dom "${SITE_ORIGIN}/?v=${GITHUB_SHA}" > /tmp/rendered.html 2> /tmp/browser-errors.log || true
            if grep -q 'Shop Now' /tmp/rendered.html; then
              echo "React storefront rendered successfully in headless Chrome."
            else
              echo "::error::React storefront did not render in headless Chrome."
              tail -n 60 /tmp/browser-errors.log || true
              head -c 1000 /tmp/rendered.html || true
              exit 1
            fi
            timeout 45 "$BROWSER" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --no-first-run --virtual-time-budget=12000 --dump-dom "${SITE_ORIGIN}/admin?v=${GITHUB_SHA}" > /tmp/admin-rendered.html 2> /tmp/admin-browser-errors.log || true
            if grep -q 'Admin Control Panel' /tmp/admin-rendered.html && grep -q 'Login to Admin Panel' /tmp/admin-rendered.html && grep -q 'Admin Gmail / Email' /tmp/admin-rendered.html && ! grep -q 'Sign In with Google' /tmp/admin-rendered.html; then
              echo "Admin email/password form rendered successfully; Google button absent."
            else
              echo "::error::Admin page failed to render in Chrome."
              tail -n 60 /tmp/admin-browser-errors.log || true
              exit 1
            fi
          else
            echo "::warning::Chrome unavailable; HTML and JS static checks passed."
          fi
