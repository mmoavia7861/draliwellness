name: Verify Windows/npm dependency install
on:
  workflow_dispatch:
  push:
    paths:
      - package.json
      - .github/workflows/npm-install-check.yml
jobs:
  npm_install_and_build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install with standard npm
        run: npm install --no-audit --no-fund
      - name: Build React website
        run: npm run build
